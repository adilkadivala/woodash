apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: notes-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-mcp
  template:
    metadata:
      labels:
        app: notes-mcp
    spec:
      containers:
        - name: notes-mcp
          image: "{{ .Values.images.notesMcp.repository }}:{{ .Values.images.notesMcp.tag }}"
          imagePullPolicy: {{ .Values.images.notesMcp.pullPolicy }}
          ports:
            - containerPort: {{ .Values.notesMcp.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.notesMcp.port | quote }}
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef: { name: mcp-tokens, key: NOTES_MCP_TOKEN }
          {{- include "platform.resources" .Values.notesMcp.resources | nindent 10 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notes-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: notes-mcp
spec:
  type: ClusterIP
  selector:
    app: notes-mcp
  ports:
    - port: {{ .Values.notesMcp.port }}
      targetPort: http
      name: http
