apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
        urumi.ai/store: {{ .Values.store.slug | quote }}
    spec:
      containers:
        - name: woo-mcp
          image: "{{ .Values.images.wooMcp.repository }}:{{ .Values.images.wooMcp.tag }}"
          imagePullPolicy: {{ .Values.images.wooMcp.pullPolicy }}
          ports:
            - containerPort: {{ .Values.wooMcp.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.wooMcp.port | quote }}
            - name: WOO_USE_MOCK
              value: "false"
            - name: WOO_STORE_URL
              value: "http://wordpress:{{ .Values.wordpress.port }}"
            - name: WOO_STORE_HOST
              value: {{ .Values.store.host | quote }}
            - name: WOO_STORE_PROTO
              value: "{{ if .Values.ingress.tls }}https{{ else }}http{{ end }}"
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef: { name: mcp-tokens, key: WOO_MCP_TOKEN }
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: mcp-tokens, key: WOO_CONSUMER_KEY }
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: mcp-tokens, key: WOO_CONSUMER_SECRET }
          {{- include "store.resources" .Values.wooMcp.resources | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app: woo-mcp
spec:
  type: ClusterIP
  selector:
    app: woo-mcp
  ports:
    - port: {{ .Values.wooMcp.port }}
      targetPort: http
      name: http
