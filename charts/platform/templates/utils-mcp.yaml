apiVersion: apps/v1
kind: Deployment
metadata:
  name: utils-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: utils-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utils-mcp
  template:
    metadata:
      labels:
        app: utils-mcp
    spec:
      containers:
        - name: utils-mcp
          image: "{{ .Values.images.utilsMcp.repository }}:{{ .Values.images.utilsMcp.tag }}"
          imagePullPolicy: {{ .Values.images.utilsMcp.pullPolicy }}
          ports:
            - containerPort: {{ .Values.utilsMcp.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.utilsMcp.port | quote }}
          {{- include "platform.resources" .Values.utilsMcp.resources | nindent 10 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: utils-mcp
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: utils-mcp
spec:
  type: ClusterIP
  selector:
    app: utils-mcp
  ports:
    - port: {{ .Values.utilsMcp.port }}
      targetPort: http
      name: http
