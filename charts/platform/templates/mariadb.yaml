apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: mariadb
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.mariadb.port }}
              name: mysql
          envFrom:
            - secretRef:
                name: store-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          {{- include "platform.resources" .Values.mariadb.resources | nindent 10 }}
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app: mariadb
spec:
  type: ClusterIP
  selector:
    app: mariadb
  ports:
    - port: {{ .Values.mariadb.port }}
      targetPort: mysql
      name: mysql
